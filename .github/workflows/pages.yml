name: Deploy to GitHub Pages

# Builds web/dist exactly like `npm run build` (web/scripts/build-site.mjs), runs the
# web tests and the smoke test against that same dist, and only then deploys it.
# The fast engine tests run in a second job at the same time.
# If any step of either job fails, the deploy job never starts and nothing is published.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. A newer push waits for the running one instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # build-site.mjs uses python3 on Linux. It needs only the standard library.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.11"

      # vite 8 and vitest 5 need Node ^20.19 or >=22.12.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            worker/package-lock.json

      - name: Install web dependencies (lockfile)
        run: npm ci
        working-directory: web

      - name: Install worker dependencies (lockfile)
        run: npm ci
        working-directory: worker

      # Same command as on a laptop: engine bundle, fetch_pyodide.py (sha256 checked),
      # worker, tsc + vite, then copy worker, engine, wheels, pyodide and fixtures into dist/.
      - name: Build
        run: npm run build
        working-directory: web

      - name: Web tests (vitest)
        run: npm test
        working-directory: web

      # The browser is needed here. The smoke script exits 0 with "SMOKE SKIPPED" when
      # Chromium cannot start, so the next step also requires the "SMOKE PASSED" line.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: web

      # --no-build: test the dist that was just built, which is the one that gets deployed.
      - name: Smoke test
        shell: bash
        run: |
          set -o pipefail
          npm run smoke -- --no-build 2>&1 | tee smoke.log
          grep -q "SMOKE PASSED" smoke.log
        working-directory: web

      # The site lives under /AtomMap/, so dist must not use localhost or root-absolute paths.
      # pyodide/ is the vendored runtime and is not scanned.
      - name: Check dist for localhost and absolute paths
        shell: bash
        working-directory: web/dist
        run: |
          if grep -rIlE 'localhost|127\.0\.0\.1' index.html assets worker.js engine fixtures results.json; then
            echo "::error::dist points to localhost"; exit 1
          fi
          if grep -E '(src|href)="/' index.html; then
            echo "::error::index.html has a root-absolute path"; exit 1
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  # The fast engine tests, natively (not in the browser), in parallel with the build job.
  # The deploy job waits for both.
  engine-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.11"
          cache: pip
          cache-dependency-path: |
            engine/pyproject.toml
            engine/requirements-lock.txt

      # requirements-lock.txt pins every package, also the transitive ones and the test tools,
      # so CI installs the same versions as a laptop.
      - name: Install the engine and its test tools
        run: pip install -c engine/requirements-lock.txt -e "engine[test]"

      # conftest.py stops the run when OPENBLAS_NUM_THREADS is not 1.
      # "not slow" skips the tests that call the real Braket simulator.
      - name: Engine tests (pytest, not slow)
        working-directory: engine
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: pytest -m "not slow"

      # Offline tests of the map data script (fake Overpass fetch, no network).
      - name: Map data script tests (scripts/test_fetch_place.py)
        run: pytest scripts/test_fetch_place.py -q

  deploy:
    needs: [build, engine-tests]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
