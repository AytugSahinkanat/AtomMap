name: Deploy to GitHub Pages

# Builds web/dist exactly like `npm run build` (web/scripts/build-site.mjs), runs the
# web tests and the smoke test against that same dist, and only then deploys it.
# If any step fails, the deploy job never starts and nothing is published.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. A newer push waits for the running one instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # build-site.mjs uses python3 on Linux. It needs only the standard library.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.11"

      # vite 8 and vitest 5 need Node ^20.19 or >=22.12.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            worker/package-lock.json

      - name: Install web dependencies (lockfile)
        run: npm ci
        working-directory: web

      - name: Install worker dependencies (lockfile)
        run: npm ci
        working-directory: worker

      # Same command as on a laptop: engine bundle, fetch_pyodide.py (sha256 checked),
      # worker, tsc + vite, then copy worker, engine, wheels, pyodide and fixtures into dist/.
      - name: Build
        run: npm run build
        working-directory: web

      - name: Web tests (vitest)
        run: npm test
        working-directory: web

      # The browser is needed here. The smoke script exits 0 with "SMOKE SKIPPED" when
      # Chromium cannot start, so the next step also requires the "SMOKE PASSED" line.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: web

      # --no-build: test the dist that was just built, which is the one that gets deployed.
      - name: Smoke test
        shell: bash
        run: |
          set -o pipefail
          npm run smoke -- --no-build 2>&1 | tee smoke.log
          grep -q "SMOKE PASSED" smoke.log
        working-directory: web

      # The site lives under /AtomMap/, so dist must not use localhost or root-absolute paths.
      # pyodide/ is the vendored runtime and is not scanned.
      - name: Check dist for localhost and absolute paths
        shell: bash
        working-directory: web/dist
        run: |
          if grep -rIlE 'localhost|127\.0\.0\.1' index.html assets worker.js engine fixtures results.json; then
            echo "::error::dist points to localhost"; exit 1
          fi
          if grep -E '(src|href)="/' index.html; then
            echo "::error::index.html has a root-absolute path"; exit 1
          fi

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
